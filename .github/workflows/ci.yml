name: CI

# GitHub-hosted checks that need no GPU. The CUDA build + kernel gates run
# separately on the self-hosted runner (see cuda-moe-regression.yml).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install ruff==0.15.11
      - run: ruff check .

  lint-web:
    name: Lint + build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  format-cpp:
    name: clang-format
    runs-on: ubuntu-latest
    # Enforced: the whole tree was swept with clang-format 19.1.7, so changed
    # files must stay formatted. Pin the exact version -- clang-format output can
    # differ across major versions.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pipx install "clang-format==19.1.7"
      - name: Check changed C/C++/CUDA files
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -z "$base" ] && base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          [ -z "$base" ] && { echo "No base ref; nothing to check."; exit 0; }
          # Regular files only (skip submodule gitlinks like third_party/llama.cpp).
          files=()
          while IFS= read -r f; do
            [ -f "$f" ] && files+=("$f")
          done < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.cu' '*.cuh')
          if [ "${#files[@]}" -eq 0 ]; then echo "No C/C++ changes."; exit 0; fi
          printf 'checking:\n%s\n' "${files[*]}"
          clang-format --dry-run --Werror "${files[@]}"

  metal-shaders:
    name: Metal shaders (compile-check)
    runs-on: macos-14
    # GitHub's macOS runners are VMs with NO GPU -- MTLCreateSystemDefaultDevice()
    # returns nil there, so Metal kernels cannot be RUN in CI. But `metal` is an
    # offline compiler, so the shaders can still be fully type-checked on every
    # push. That is the only fast feedback available without renting a Mac, and
    # without it the shaders would be written blind. Running them for real is a
    # separate, manual step on actual Apple Silicon.
    steps:
      - uses: actions/checkout@v4
      - name: Compile the shaders to a metallib
        run: |
          set -euxo pipefail
          xcrun -sdk macosx metal -Werror -c src/kernels/metal/cpi_kernels.metal -o cpi_kernels.air
          xcrun -sdk macosx metallib cpi_kernels.air -o cpi_kernels.metallib
          ls -l cpi_kernels.metallib

  build-cpu:
    name: Build (CPU-only) + tests
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon (arm64). It is the only non-x86 target in CI,
        # so it is what keeps the CPU engines' scalar fallbacks honest -- the AVX2
        # paths compile out there, and nothing else would catch a stray intrinsic.
        # Apple clang ships no OpenMP; the build degrades to single-threaded.
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CUDA off, sentencepiece off)
        run: >
          cmake -S . -B build
          -DLLAMA_ENGINE_ENABLE_CUDA=OFF
          -DLLAMA_ENGINE_ENABLE_SENTENCEPIECE=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  build-cuda:
    name: Build (CUDA compile-only)
    runs-on: ubuntu-latest
    # Free GitHub-hosted runner (no GPU): nvcc COMPILES + links the CUDA path to
    # catch build breakage cross-machine. The parity/throughput gate that must
    # RUN kernels stays on the self-hosted GPU box (cuda-moe-regression.yml).
    # The official CUDA devel image ships nvcc + cuBLAS; ubuntu24.04 gives an
    # apt cmake >= 3.24.
    container: nvidia/cuda:12.6.2-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ git ca-certificates
      - uses: actions/checkout@v4
      - name: Configure (CUDA on, fixed arch, sentencepiece off)
        run: >
          cmake -S . -B build
          -DLLAMA_ENGINE_ENABLE_CUDA=ON
          -DLLAMA_ENGINE_ENABLE_SENTENCEPIECE=OFF
          -DLLAMA_ENGINE_ENABLE_LTO=OFF
          -DCMAKE_CUDA_ARCHITECTURES=89
          -DCMAKE_BUILD_TYPE=Release
      - name: Compile + link (no GPU execution)
        run: cmake --build build --config Release --target llama_infer -j

  repo-hygiene:
    name: No committed build/model artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against tracked artifacts
        shell: bash
        run: |
          bad="$(git ls-files | grep -iE '(^|/)(build|dist|node_modules|out)/|\.(ll2c|ll2cs|safetensors|obj|exe|o)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Tracked build/model artifacts found (should be gitignored):"
            echo "$bad"
            exit 1
          fi
          echo "No tracked build/model artifacts."
