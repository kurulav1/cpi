name: CUDA MoE Regression

# GPU parity + throughput gate. Runs kernels and measures decode tok/s, so it
# needs a real GPU and lives on the self-hosted runner. Triggered manually (and
# weekly) rather than on every push: otherwise runs queue indefinitely whenever
# the self-hosted box is offline. The free GitHub-hosted `build-cuda` job in
# ci.yml covers "does the CUDA path still compile" on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

jobs:
  cuda-build-moe-gates:
    runs-on: [self-hosted, cuda]
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release -j 6

      - name: Run deterministic MoE kernel parity test
        shell: pwsh
        run: ctest --test-dir build -C Release -R moe_kernel_parity_test --output-on-failure

      - name: Run decode-attention parity gates (reference-oracle + paged + batched)
        shell: pwsh
        run: ctest --test-dir build -C Release -R "attention_reference_parity_test|batched_paged_attention_reference_parity_test|paged_attention_parity_test|paged_batched_attention_parity_test" --output-on-failure

      - name: Download and convert Mixtral checkpoint (CI-sized)
        shell: pwsh
        run: |
          python tools/hf_download.py download TitanML/tiny-mixtral --family mixtral --output-dir artifacts/ci_mixtral

      - name: Quantize Mixtral int8/int4
        shell: pwsh
        run: |
          python tools/quantize_ll2c_streaming.py --input artifacts/ci_mixtral/tiny-mixtral.ll2c --output artifacts/ci_mixtral/tiny-mixtral-int8.ll2c --mode int8 --overwrite
          python tools/quantize_ll2c_streaming.py --input artifacts/ci_mixtral/tiny-mixtral.ll2c --output artifacts/ci_mixtral/tiny-mixtral-int4.ll2c --mode int4 --overwrite

      - name: Run MoE perf/parity CI gate
        shell: pwsh
        run: |
          python tools/ci/moe_regression_gate.py `
            --llama-infer build/Release/llama_infer.exe `
            --tokenizer artifacts/ci_mixtral/hf/tokenizer.model `
            --fp16-model artifacts/ci_mixtral/tiny-mixtral.ll2c `
            --int8-model artifacts/ci_mixtral/tiny-mixtral-int8.ll2c `
            --int4-model artifacts/ci_mixtral/tiny-mixtral-int4.ll2c `
            --thresholds tools/ci/moe_gate_thresholds.json `
            --result-json artifacts/ci_moe_gate_result.json

      - name: Write job summary
        if: always()
        shell: pwsh
        run: |
          $result = Get-Content artifacts/ci_moe_gate_result.json -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          $md = [System.Text.StringBuilder]::new()
          [void]$md.AppendLine("## MoE Regression Gate")
          if ($null -eq $result) {
            [void]$md.AppendLine("> Gate result JSON not found — the gate step may have failed before writing output.")
          } else {
            $overall = if ($result.failed) { ":x: **FAILED**" } else { ":white_check_mark: **PASSED**" }
            [void]$md.AppendLine($overall)
            [void]$md.AppendLine("")
            [void]$md.AppendLine("### Throughput (decode tok/s)")
            [void]$md.AppendLine("")
            [void]$md.AppendLine("| Mode | Decode tok/s | Prefill ms |")
            [void]$md.AppendLine("|------|-------------:|-----------:|")
            foreach ($mode in @("fp16", "int8", "int4")) {
              $m = $result.models.$mode
              if ($null -ne $m) {
                $dtps = if ($null -ne $m.bench.decode_tok_per_s) { "{0:F2}" -f $m.bench.decode_tok_per_s } else { "—" }
                $pfms = if ($null -ne $m.bench.prefill_ms) { "{0:F1}" -f $m.bench.prefill_ms } else { "—" }
                [void]$md.AppendLine("| $mode | $dtps | $pfms |")
              }
            }
            [void]$md.AppendLine("")
            [void]$md.AppendLine("### Logit Parity (vs fp16 baseline)")
            [void]$md.AppendLine("")
            [void]$md.AppendLine("| Mode | top1 match | overlap@k | mean abs | max abs | Status |")
            [void]$md.AppendLine("|------|:----------:|----------:|---------:|--------:|--------|")
            $thresholds = $result.thresholds
            foreach ($mode in @("int8", "int4")) {
              $p = $result.parity.$mode
              if ($null -ne $p) {
                $t1    = if ($p.top1_match -eq 1) { ":white_check_mark:" } else { ":x:" }
                $ovlp  = "{0:F3}" -f $p.overlap_at_k
                $mabs  = if ([double]::IsInfinity($p.mean_abs)) { "∞" } else { "{0:F4}" -f $p.mean_abs }
                $xabs  = if ([double]::IsInfinity($p.max_abs))  { "∞" } else { "{0:F4}" -f $p.max_abs }
                $maxMeanKey = "$(${mode})_max_mean_abs"
                $minOvlpKey = "$(${mode})_min_overlap"
                $maxMean = if ($null -ne $thresholds.$maxMeanKey) { $thresholds.$maxMeanKey } else { [double]::PositiveInfinity }
                $minOvlp = if ($null -ne $thresholds.$minOvlpKey) { $thresholds.$minOvlpKey } else { 0.0 }
                $ok = (-not [double]::IsInfinity($p.mean_abs)) -and ($p.mean_abs -le $maxMean) -and ($p.overlap_at_k -ge $minOvlp)
                $status = if ($ok) { ":white_check_mark: pass" } else { ":x: fail" }
                [void]$md.AppendLine("| $mode | $t1 | $ovlp | $mabs | $xabs | $status |")
              }
            }
          }
          $md.ToString() | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload MoE gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-moe-gate-result
          path: artifacts/ci_moe_gate_result.json

