name: Release

# Cut a GitHub Release on a version tag (vX.Y.Z). Attaches portable binaries per
# OS: CPU for linux x64/arm64, windows and macos (Metal), plus CUDA for windows
# and linux x64. Every packaged Linux binary carries its own runtime libraries
# and is gated on them being present, because an asset that only runs on the
# machine that built it is worse than no asset.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build CPU binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cpi-linux-x64-cpu
            bin: build/cpi
          - os: windows-latest
            asset: cpi-windows-x64-cpu
            bin: build/Release/cpi.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CPU-only)
        shell: bash
        # -rpath $ORIGIN so a Linux binary looks beside itself for its runtime
        # libraries. v0.3.0-rc1 shipped cpi-linux-x64-cpu that would not start on a
        # stock Ubuntu 24.04 at all: ldd reported "libgomp.so.1 => not found", the
        # GNU OpenMP runtime the CPU kernels link. Bundling it (below) only helps if
        # the loader will look next to the binary, which is what this does. Harmless
        # on Windows, where the loader already searches the exe directory.
        run: |
          EXTRA=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            EXTRA="-DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath,'\$ORIGIN'"
          fi
          cmake -S . -B build -DCPI_ENABLE_CUDA=OFF -DCPI_ENABLE_SENTENCEPIECE=OFF -DCMAKE_BUILD_TYPE=Release $EXTRA
      - name: Build cpi
        run: cmake --build build --config Release --target cpi -j
      - name: Smoke test the binary
        # This workflow used to build, package and publish without ever running
        # what it shipped. A released binary that cannot start is the failure
        # users hit first, and this project has shipped one before.
        shell: bash
        run: '"${{ matrix.bin }}" --version'
      - name: Stage package
        shell: bash
        run: |
          mkdir -p pkg/${{ matrix.asset }}
          cp "${{ matrix.bin }}" pkg/${{ matrix.asset }}/
          cp README.md LICENSE NOTICE pkg/${{ matrix.asset }}/ 2>/dev/null || true
          # Ship the GNU OpenMP runtime beside the binary on Linux. A stock Ubuntu
          # 24.04 does not have libgomp.so.1, so rc1's asset died on startup with
          # "cannot open shared object file" before printing anything.
          if [ "${{ runner.os }}" = "Linux" ]; then
            for lib in $(ldd "${{ matrix.bin }}" | awk '/libgomp/ {print $3}'); do
              [ -e "$lib" ] && cp -L "$lib" pkg/${{ matrix.asset }}/
            done
          fi
      - name: Check the packaged binary resolves (Linux)
        # The real test of a portable binary: every dependency resolves from inside
        # the package, with nothing from the build machine on the path. rc1 would
        # have failed here instead of shipping.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd pkg/${{ matrix.asset }}
          ldd ./cpi || true
          # Two separate checks. "not found" catches the general case, but NOT the one
          # that shipped: the build machine has libgomp installed, so ldd resolves it
          # there from /usr/lib and looks fine. What matters is whether the library
          # travelled with the package, so that is asserted directly.
          if ldd ./cpi | grep -q "not found"; then
            echo "::error::packaged binary has unresolved libraries; not publishing it"
            ldd ./cpi | grep "not found"
            exit 1
          fi
          if ldd ./cpi | grep -q libgomp && [ ! -e libgomp.so.1 ]; then
            echo "::error::binary needs libgomp but it was not bundled; it would not start on a stock Ubuntu"
            exit 1
          fi
          ./cpi --version
      - name: Archive
        shell: bash
        run: |
          cd pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${{ matrix.asset }}.zip" "${{ matrix.asset }}" >/dev/null
          else
            tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: pkg/${{ matrix.asset }}.*

  build-macos-metal:
    name: Build macOS Metal binary
    runs-on: macos-14  # Apple Silicon (arm64) runner -- Metal backend on by default
    # The hosted macos-14 runner's Xcode/clang can fail to build where real Apple Silicon
    # (newer toolchain) succeeds, so this must not block the release: CPU binaries still ship,
    # and the macOS asset is attached only when the runner build succeeds.
    continue-on-error: true
    env:
      ASSET: cpi-macos-arm64-metal
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Metal, CUDA off)
        run: >
          cmake -S . -B build
          -DCPI_ENABLE_CUDA=OFF
          -DCPI_ENABLE_METAL=ON
          -DCPI_ENABLE_SENTENCEPIECE=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build cpi
        run: cmake --build build --config Release --target cpi -j
      - name: Smoke test the binary
        # Runs what was just built and checks WHAT IT SAYS. v0.3.0-rc1 published a
        # cpi-windows-x64-cuda asset that reported "backends: cpu": CMake had fallen
        # back to a CPU-only build, the job stayed green, and a bare --version call
        # would have passed. Asserting the backend is what makes this a gate.
        shell: bash
        run: |
          OUT=$(build/cpi --version)
          echo "$OUT"
          echo "$OUT" | grep -q "metal" || {
            echo "::error::binary does not report the metal backend; not publishing it"
            exit 1
          }
      - name: Stage package
        shell: bash
        run: |
          # The Metal backend compiles its shaders at runtime, so the .metal sources ship
          # alongside the binary and a launcher points CPI_METAL_SOURCE at them. Running the
          # bare binary also works if CPI_METAL_SOURCE is set by hand.
          mkdir -p "pkg/$ASSET/metal"
          cp build/cpi "pkg/$ASSET/"
          cp src/kernels/metal/*.metal "pkg/$ASSET/metal/"
          cp README.md LICENSE NOTICE "pkg/$ASSET/" 2>/dev/null || true
          cat > "pkg/$ASSET/run.sh" <<'EOF'
          #!/bin/bash
          # Launcher: resolve the bundle dir, point the Metal backend at the shipped shaders.
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export CPI_METAL_SOURCE="$DIR/metal"
          exec "$DIR/cpi" "$@"
          EOF
          chmod +x "pkg/$ASSET/run.sh" "pkg/$ASSET/cpi"
      - name: Archive
        shell: bash
        run: |
          cd pkg && tar -czf "$ASSET.tar.gz" "$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: pkg/*.tar.gz

  build-linux-arm64:
    name: Build CPU binary (linux arm64)
    runs-on: ubuntu-24.04-arm
    # Best-effort like macOS: a runner-label or toolchain change here must not stop the
    # x64 assets shipping. The x86 SIMD paths compile out on aarch64 and the engine falls
    # back to its scalar kernels, so this is a correctness build, not a fast one.
    continue-on-error: true
    env:
      ASSET: cpi-linux-arm64-cpu
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CPU-only)
        shell: bash
        # rpath $ORIGIN for the same reason as the x64 job: libgomp travels with
        # the package and the loader has to look beside the binary to find it.
        run: |
          cmake -S . -B build -DCPI_ENABLE_CUDA=OFF -DCPI_ENABLE_SENTENCEPIECE=OFF -DCMAKE_BUILD_TYPE=Release "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath,'\$ORIGIN'"
      - name: Build cpi
        run: cmake --build build --config Release --target cpi -j
      - name: Smoke test the binary
        # Runs what was just built and checks WHAT IT SAYS. v0.3.0-rc1 published a
        # cpi-windows-x64-cuda asset that reported "backends: cpu": CMake had fallen
        # back to a CPU-only build, the job stayed green, and a bare --version call
        # would have passed. Asserting the backend is what makes this a gate.
        shell: bash
        run: build/cpi --version
      - name: Stage package
        shell: bash
        run: |
          mkdir -p "pkg/$ASSET"
          cp build/cpi "pkg/$ASSET/"
          cp README.md LICENSE NOTICE "pkg/$ASSET/" 2>/dev/null || true
          for lib in $(ldd build/cpi | awk '/libgomp/ {print $3}'); do
            [ -e "$lib" ] && cp -L "$lib" "pkg/$ASSET/"
          done
      - name: Check the packaged binary resolves
        shell: bash
        run: |
          cd "pkg/$ASSET"
          ldd ./cpi || true
          if ldd ./cpi | grep -q "not found"; then
            echo "::error::packaged binary has unresolved libraries; not publishing it"
            exit 1
          fi
          if ldd ./cpi | grep -q libgomp && [ ! -e libgomp.so.1 ]; then
            echo "::error::binary needs libgomp but it was not bundled"
            exit 1
          fi
          ./cpi --version
      - name: Archive
        shell: bash
        run: cd pkg && tar -czf "$ASSET.tar.gz" "$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: pkg/*.tar.gz

  build-cuda-windows:
    name: Build CUDA binary (windows)
    # windows-2022, NOT windows-latest. The latest image is win25-vs2026 with MSVC
    # 19.51, and CUDA 12.6 refuses it outright: "unsupported Microsoft Visual Studio
    # version! Only the versions between 2017 and 2022 (inclusive) are supported".
    # -allow-unsupported-compiler does not rescue it either, CMake retried with the
    # flag and the compile still failed. 12.6.2 is the newest the installer action
    # offers, so the fix is the older runner rather than a newer toolkit.
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.2"
          method: network
      - name: Install Ninja
        shell: bash
        run: pip install ninja
      - name: Report the CUDA toolchain
        continue-on-error: true
        shell: bash
        run: |
          echo "CUDA_PATH=$CUDA_PATH"
          nvcc --version || echo "nvcc not on PATH"
          cmake --version | head -1
      - name: Configure and build
        shell: cmd
        # Ninja rather than the Visual Studio generator: the VS generator reaches CUDA
        # only through MSBuild integration files the toolkit drops into the VS tree, and
        # it found nothing that way. Ninja calls nvcc directly but does not set up the
        # MSVC environment, so vcvars runs first.
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build -G Ninja -DCPI_ENABLE_CUDA=ON -DCPI_REQUIRE_CUDA=ON -DCPI_ENABLE_SENTENCEPIECE=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe" "-DCMAKE_CUDA_ARCHITECTURES=75;80;86;89;90" || exit /b 1
          cmake --build build --target cpi -j || exit /b 1
      - name: Smoke test the binary
        # Asserts what the binary SAYS. v0.3.0-rc1 shipped a 385 MB asset named
        # cpi-windows-x64-cuda that reported "backends: cpu", and a bare --version
        # call passed it.
        shell: bash
        run: |
          OUT=$(build/cpi.exe --version)
          echo "$OUT"
          echo "$OUT" | grep -q "cuda" || {
            echo "::error::binary does not report the cuda backend; not publishing it"
            exit 1
          }
      - name: Stage package
        shell: bash
        run: |
          DEST=pkg/cpi-windows-x64-cuda
          mkdir -p "$DEST"
          cp build/cpi.exe "$DEST/"
          cp README.md LICENSE NOTICE "$DEST/" 2>/dev/null || true
          # cudart and cuBLAS are toolkit components, not driver components: someone with
          # an NVIDIA driver still does not have them.
          cp "$CUDA_PATH"/bin/cudart64_*.dll "$DEST/" 2>/dev/null || true
          cp "$CUDA_PATH"/bin/cublas64_*.dll "$DEST/" 2>/dev/null || true
          cp "$CUDA_PATH"/bin/cublasLt64_*.dll "$DEST/" 2>/dev/null || true
      - name: Archive
        shell: bash
        run: cd pkg && 7z a cpi-windows-x64-cuda.zip cpi-windows-x64-cuda >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: cpi-windows-x64-cuda
          path: pkg/cpi-windows-x64-cuda.zip

  build-cuda-linux:
    name: Build CUDA binary (linux)
    runs-on: ubuntu-latest
    # The toolkit installer action failed outright on ubuntu in rc2 through rc4. This
    # uses the official CUDA image instead, the same approach ci.yml already builds the
    # CUDA path with. 12.8 rather than the 12.6.2 ci.yml pins, because sm_120 (Blackwell)
    # only exists from 12.8 on: unlike the Windows job, a container is not limited to
    # whatever the installer action happens to carry, so Linux gets the full range.
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    continue-on-error: true
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ ninja-build git ca-certificates
      - uses: actions/checkout@v4
      - name: Configure and build
        # -rpath $ORIGIN for the same reason as the CPU jobs: the CUDA runtime
        # libraries are bundled below, and bundling only helps if the loader looks
        # next to the binary. Without it the binary carries the container's own
        # /usr/local/cuda-12.8/targets path, which exists on no user's machine.
        run: |
          set -e
          EXTRA="-DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath,'\$ORIGIN'"
          cmake -S . -B build -G Ninja -DCPI_ENABLE_CUDA=ON -DCPI_REQUIRE_CUDA=ON -DCPI_ENABLE_SENTENCEPIECE=OFF -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CUDA_ARCHITECTURES=75;80;86;89;90;120" $EXTRA
          cmake --build build --target cpi -j
      - name: Smoke test the binary
        run: |
          OUT=$(build/cpi --version)
          echo "$OUT"
          echo "$OUT" | grep -q "cuda" || {
            echo "::error::binary does not report the cuda backend; not publishing it"
            exit 1
          }
      - name: Stage package
        run: |
          DEST=pkg/cpi-linux-x64-cuda
          mkdir -p "$DEST"
          cp build/cpi "$DEST/"
          cp README.md LICENSE NOTICE "$DEST/" 2>/dev/null || true
          # Ask the binary what it needs rather than globbing a directory, which is
          # what the CPU jobs do and what this job got wrong. The previous version
          # globbed /usr/local/cuda/lib64: that is a symlink in these images, find
          # does not descend into a symlinked start directory without -L, so it
          # matched nothing, every cp was skipped, and "|| true" swallowed the
          # silence. v0.3.0-rc7 shipped a tarball with no libraries in it at all,
          # which died on a stock Ubuntu with "libcudart.so.12: cannot open shared
          # object file". cp -L because these are symlinks to versioned files, and
          # cp -P would have copied them as dangling links even on a match.
          # libgomp is in the list too: the CUDA build links it just like the CPU
          # build does, and it is absent from a stock Ubuntu 24.04.
          for lib in $(ldd build/cpi | awk '/libcudart|libcublasLt|libcublas|libgomp/ {print $3}'); do
            [ -e "$lib" ] && cp -L "$lib" "$DEST/"
          done
          SH="$DEST/run.sh"
          echo '#!/bin/bash' > "$SH"
          echo 'DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' >> "$SH"
          echo 'export LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"' >> "$SH"
          echo 'exec "$DIR/cpi" "$@"' >> "$SH"
          chmod +x "$SH" "$DEST/cpi"
      - name: Check the packaged binary resolves
        # This job smoke-tests build/cpi inside the CUDA container, where all four
        # runtime libraries exist system-wide, so that test passes whether or not
        # anything was packaged. It cannot see the failure a user would hit. The
        # per-library assertion below can: it asks whether the library travelled
        # with the package, not whether the build machine happens to have it.
        run: |
          cd pkg/cpi-linux-x64-cuda
          ldd ./cpi || true
          if ldd ./cpi | grep -q "not found"; then
            echo "::error::packaged binary has unresolved libraries; not publishing it"
            ldd ./cpi | grep "not found"
            exit 1
          fi
          for so in libcudart.so.12 libcublas.so.12 libcublasLt.so.12 libgomp.so.1; do
            if ldd ./cpi | grep -q "$so" && [ ! -e "$so" ]; then
              echo "::error::binary needs $so but it was not bundled; it would not start outside this container"
              exit 1
            fi
          done
          ./cpi --version
      - name: Archive
        run: cd pkg && tar -czf cpi-linux-x64-cuda.tar.gz cpi-linux-x64-cuda
      - uses: actions/upload-artifact@v4
        with:
          name: cpi-linux-x64-cuda
          path: pkg/cpi-linux-x64-cuda.tar.gz

  release:
    name: Publish release
    needs: [build-binaries, build-macos-metal, build-linux-arm64, build-cuda-windows, build-cuda-linux]
    # Publish as long as the CPU binaries built; the macOS job is best-effort (see above).
    if: ${{ always() && needs.build-binaries.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          # Any tag carrying a suffix (v0.3.0-rc1) publishes as a prerelease, so a
          # dry run of the asset matrix cannot present itself to users as the
          # current version.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: dist/*
          body: |
            ## CPI ${{ github.event.inputs.tag || github.ref_name }}

            Prebuilt `cpi` binaries:

            | Asset | Platform | Backend |
            |---|---|---|
            | `cpi-linux-x64-cpu` | Linux x64 | CPU |
            | `cpi-windows-x64-cpu` | Windows x64 | CPU |
            | `cpi-linux-arm64-cpu` | Linux arm64 | CPU |
            | `cpi-linux-x64-cuda` | Linux x64 | CUDA GPU + CPU |
            | `cpi-windows-x64-cuda` | Windows x64 | CUDA GPU + CPU |
            | `cpi-macos-arm64-metal` | macOS (Apple Silicon) | Metal GPU + CPU |

            The x64 CPU assets always ship. The arm64, CUDA and macOS ones are
            best-effort on hosted runners and are attached only when their job
            succeeded, so a missing asset means that build did not run, not that
            the platform is unsupported.

            Verify a build with `cpi --version`. It prints the backends actually
            compiled in, e.g. `backends: cpu, cuda`.

            ### Getting a model

            Quickest path, no conversion and no extra files. Download any GGUF of a
            supported architecture and point `cpi` at it:

            ```
            cpi model.gguf --serve
            ```

            That is the whole setup. The GGUF carries its own tokenizer, and the chat
            template is picked from the filename, so an OpenAI-compatible API is
            listening on port 8080 with no other flags. Drop `--serve` and pass
            `--prompt "..."` for a one-shot completion.

            A quantized GGUF is **dequantized to fp16 at load**, so the download
            shrinks but the resident model does not. Add `--weight-quant int4` to keep
            it packed: on an 8B Q4_K_M that is 20.7 GB down to 12.5 GB, and decode goes
            up rather than down (74 to 134 tok/s), because decode is bandwidth-bound.

            Models outside the GGUF-mapped architectures below convert to CPI's own
            container first; see [Preparing
            Models](https://github.com/kurulav1/cpi#preparing-models).

            ### Supported models

            | Family | Direct from GGUF | Via `.ll2c` / `.cpi` |
            |---|---|---|
            | Llama 2 / 3 / 3.1 / 3.2 | yes, verified | yes |
            | Qwen2 / Qwen2.5 | yes | yes |
            | Qwen3 dense, Qwen3.5 | no | yes |
            | Mistral, Mixtral (MoE) | no | yes |
            | Phi-3 | no | yes |
            | Gemma 1 | no | yes |
            | Gemma 4 (incl. vision, MoE) | no | yes |
            | DeepSeek-V2 (MLA + MoE) | no | yes |

            An unmapped GGUF architecture is **refused with an explanation**, not loaded
            under the wrong conventions. That is deliberate: the tensor names still look
            recognisable, so the failure being avoided is confident nonsense rather than
            a crash. Gemma's `(1+w)` norms, Gemma 4's per-layer embeddings and
            DeepSeek's MLA projections each need mapping before their GGUFs can be
            trusted.

            ### macOS (Metal)
            The macOS asset is attached only when the hosted CI runner could build it; its Xcode
            can lag real Apple Silicon. If it is missing, build from source (it compiles cleanly on
            current Apple Silicon) -- see [Build Modes](https://github.com/kurulav1/cpi#build-modes).

            The Metal backend compiles its shaders at runtime, so the archive bundles the
            `.metal` sources next to the binary. Use the included launcher:

            ```
            ./run.sh model.gguf --prompt "..." --weight-quant int4
            ```

            (or run `cpi` directly with `CPI_METAL_SOURCE=./metal` set). First launch
            may prompt Gatekeeper on an unsigned binary -- allow it in System Settings › Privacy.

            ### GPU (CUDA) builds
            The Linux CUDA asset is compiled for Turing through Blackwell
            (sm_75/80/86/89/90/120). The Windows one stops at Hopper (sm_75-90), since
            sm_120 needs CUDA 12.8 and the Windows CI installer only offers 12.6.2. It
            still RUNS on an RTX 50xx: the build embeds compute_90 PTX and the driver
            JIT-compiles it forward (measured 344 tok/s on a 5090, against 18 tok/s for
            the same binary on CPU). The cost is a one-time JIT at first load; build from
            source for native SASS. Both bundle cudart and cuBLAS, which a driver install
            does not provide; on Linux launch through the bundled ./run.sh.

            For a GPU outside that list, or for the smallest binary for your own card,
            build from source with a CUDA toolkit present:

            ```
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release
            ```

            See the README for prerequisites and the web UI / REST API setup.
