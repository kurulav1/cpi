# Local single-node (kind) variant of the CPI inference plane: CPU-only, no GPU
# device plugin, NodePort instead of Ingress, hostPath model store instead of a
# ReadWriteMany PVC. Mirrors deploy/k8s/kind-data-parallel-job.yaml on the CPT side
# so the whole train->serve loop can be demonstrated on one kind cluster.
#
# Usage (after `kind create cluster` and building the CPI image):
#   kind load docker-image cpi-llama:test --name cpt
#   # drop a model into the shared host dir the node can see:
#   #   /tmp/cpt-models/model.ll2c  +  /tmp/cpt-models/tokenizer.json
#   kubectl apply -f deploy/k8s/kind-inference-deployment.yaml
#   kubectl get pods -l app=cpi-kind -w
#   kubectl port-forward svc/cpi-kind 3001:80
#   curl localhost:3001/api/health
#
# Without a model present the pod still becomes Ready (the server is up); /api/health
# will report "ready":false until LLAMA_MODEL_PATH exists and loads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpi-kind
  labels:
    app: cpi-kind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpi-kind
  template:
    metadata:
      labels:
        app: cpi-kind
    spec:
      volumes:
        - name: models
          hostPath:
            path: /tmp/cpt-models      # shared on the single kind node
            type: DirectoryOrCreate
      containers:
        - name: web
          image: cpi-llama:test
          imagePullPolicy: Never        # use the image loaded via `kind load docker-image`
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: CPI_BIN
              value: /app/bin/cpi
            - name: LLAMA_MODEL_DIRS
              value: /models
            - name: LLAMA_MODEL_PATH
              value: /models/Qwen2.5-Coder-3B-Instruct.ll2c
            - name: LLAMA_TOKENIZER_PATH
              value: /models/tokenizer.json
            - name: LLAMA_CHAT_TEMPLATE
              value: qwen2
            # A large fixed system prompt can exceed the 2048 server default and
            # get truncated (dropping later instructions). Match web/config.json.
            - name: LLAMA_MAX_CONTEXT
              value: "8192"
            # Larger batched prefill pass (built-in default 16 is ~5.3x slower on GPU).
            - name: CPI_PREFILL_CHUNK_SIZE
              value: "256"
            # CPU-only inference pegs the CPU at 100%, which trips CPI's resource
            # governor (default 85%). Relax it for this CPU smoke-test pod.
            - name: LLAMA_MAX_CPU_PERCENT
              value: "100"
            - name: LLAMA_MAX_MEMORY_PERCENT
              value: "100"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cpi-kind
  labels:
    app: cpi-kind
spec:
  selector:
    app: cpi-kind
  ports:
    - name: http
      port: 80
      targetPort: 3001
  type: NodePort
