# Production-grade GPU serving pod for kind on WSL2/Docker Desktop.
#
# Hardening vs a naive Deployment:
#  - Model on a PERSISTENT PVC (model-pvc.yaml), not tmpfs; survives restarts, no re-seed.
#  - Model is WARMED on boot (LLAMA_WARM_ON_START) and readiness is gated on the model
#    actually being loaded (/healthz/ready 503s until warm), so the Service never routes
#    to a cold pod: no first-request cold-start latency, no 503s during scale-up/rollout.
#  - startupProbe gives the ~60s GPU model load room without the livenessProbe killing it.
#  - resource requests/limits (Burstable QoS), graceful drain (preStop + grace period),
#    and a zero-unavailable rolling update.
#
# GPU is the WSL2 bind-mount trick (privileged + /dev/dxg + /usr/lib/wsl). On a real
# cluster drop that and add resources.limits.nvidia.com/gpu: 1 + the device plugin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpi-kind
  labels:
    app: cpi-kind
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0          # never drop below desired during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      app: cpi-kind
  template:
    metadata:
      labels:
        app: cpi-kind
    spec:
      terminationGracePeriodSeconds: 40
      volumes:
        # Multi-model store on the node's persistent /var (ext4). One subdir per
        # model (.ll2c + its tokenizer.json) so CPI auto-discovers + pairs each.
        # hostPath (not the PVC) because local-path can't expand past 12Gi; /var is
        # equally persistent. Real clusters: a sized RWX PVC or object store.
        - name: models
          hostPath:
            path: /var/cpi-models
            type: DirectoryOrCreate
        - name: wsl-libs
          hostPath:
            path: /usr/lib/wsl
            type: Directory
        - name: dxg
          hostPath:
            path: /dev/dxg
            type: CharDevice
      containers:
        - name: web
          image: cpi-llama:test
          imagePullPolicy: Never
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo /usr/lib/wsl/lib > /etc/ld.so.conf.d/wsl.conf
              for d in /usr/lib/wsl/drivers/*/; do echo "$d" >> /etc/ld.so.conf.d/wsl.conf; done
              ldconfig
              cd /app/web && exec npm run start
          lifecycle:
            preStop:
              exec:
                # Let the Service stop sending new traffic before the server exits,
                # so in-flight requests drain instead of erroring on rollout/scale-down.
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - containerPort: 3001
          env:
            - { name: PORT, value: "3001" }
            - { name: CPI_BIN, value: /app/bin/cpi }
            - { name: LLAMA_MODEL_DIRS, value: /models }   # scanned recursively -> lists all models
            - { name: LLAMA_MODEL_PATH, value: /models/Qwen2.5-Coder-3B-Instruct/Qwen2.5-Coder-3B-Instruct.ll2c }
            - { name: LLAMA_TOKENIZER_PATH, value: /models/Qwen2.5-Coder-3B-Instruct/tokenizer.json }
            - { name: LLAMA_CHAT_TEMPLATE, value: qwen2 }   # ChatML; both served models are Qwen2.5
            - { name: LLAMA_WARM_ON_START, value: "1" }
            - { name: LLAMA_MAX_CPU_PERCENT, value: "100" }
            - { name: LLAMA_MAX_MEMORY_PERCENT, value: "100" }
          resources:
            # The 6.8GB model is resident in GPU VRAM, not host RAM; host footprint is
            # the Node server + cpi buffers (~1-2GB). Keep requests modest so
            # replicas/alternative paths fit the node; limit guards against leaks.
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 8Gi
          # startup: hold off liveness/readiness until the model finishes loading
          # (~60s). 5s * 60 = up to 5 min budget for a cold GPU load.
          startupProbe:
            httpGet: { path: /healthz/ready, port: 3001 }
            periodSeconds: 5
            failureThreshold: 60
          # readiness: only receive traffic once the model is warm.
          readinessProbe:
            httpGet: { path: /healthz/ready, port: 3001 }
            periodSeconds: 10
            failureThreshold: 3
          # liveness: restart only if the process itself wedges (not gated on model).
          livenessProbe:
            httpGet: { path: /healthz/live, port: 3001 }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: wsl-libs, mountPath: /usr/lib/wsl, readOnly: true }
            - { name: dxg, mountPath: /dev/dxg }
---
apiVersion: v1
kind: Service
metadata:
  name: cpi-kind
  labels:
    app: cpi-kind
spec:
  selector:
    app: cpi-kind
  ports:
    - name: http
      port: 80
      targetPort: 3001
  type: NodePort
