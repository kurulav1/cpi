# Custom KServe ServingRuntime wrapping the CPI engine. This is how you plug a
# non-standard engine into KServe's control plane: declare a model format the
# runtime serves (here "ll2c") and the container that serves it. KServe then
# builds the Deployment/Service/HPA/route for any InferenceService that asks for
# this format/runtime -- you keep your engine, KServe owns the serving lifecycle.
#
# GPU here uses the same WSL2/Docker-Desktop bind-mount trick as the plain pod
# (privileged + /dev/dxg + /usr/lib/wsl, ldconfig before start). On a real cluster
# you'd drop all that and add `resources: { limits: { nvidia.com/gpu: 1 } }`.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: cpi-llama
  namespace: default
spec:
  supportedModelFormats:
    - name: ll2c
      version: "1"
      autoSelect: true
  protocolVersions:
    - v1
  containers:
    - name: kserve-container          # KServe requires this exact name
      image: cpi-llama:test
      imagePullPolicy: Never
      securityContext:
        privileged: true              # access /dev/dxg (WSL GPU)
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo /usr/lib/wsl/lib > /etc/ld.so.conf.d/wsl.conf
          for d in /usr/lib/wsl/drivers/*/; do echo "$d" >> /etc/ld.so.conf.d/wsl.conf; done
          ldconfig
          cd /app/web && exec npm run start
      ports:
        - containerPort: 3001
          protocol: TCP
      env:
        - { name: PORT, value: "3001" }
        - { name: CPI_BIN, value: /app/bin/cpi }
        - { name: LLAMA_MODEL_DIRS, value: /models }   # scanned recursively -> all models
        - { name: LLAMA_MODEL_PATH, value: /models/Qwen2.5-Coder-3B-Instruct/Qwen2.5-Coder-3B-Instruct.ll2c }
        - { name: LLAMA_TOKENIZER_PATH, value: /models/Qwen2.5-Coder-3B-Instruct/tokenizer.json }
        - { name: LLAMA_CHAT_TEMPLATE, value: qwen2 }   # ChatML -- matches Qwen2.5
        - { name: LLAMA_WARM_ON_START, value: "1" }   # load the model at boot
        - { name: LLAMA_MAX_CPU_PERCENT, value: "100" }
        - { name: LLAMA_MAX_MEMORY_PERCENT, value: "100" }
      resources:                        # model is in GPU VRAM; host footprint is small
        requests: { cpu: "1", memory: 2Gi }
        limits: { memory: 8Gi }
      # Gate traffic on the model being warm (not just the process being up), and give
      # the ~60s GPU load room before liveness/readiness apply.
      startupProbe:
        httpGet: { path: /healthz/ready, port: 3001 }
        periodSeconds: 5
        failureThreshold: 60
      readinessProbe:
        httpGet: { path: /healthz/ready, port: 3001 }
        periodSeconds: 10
        failureThreshold: 3
      livenessProbe:
        httpGet: { path: /healthz/live, port: 3001 }
        periodSeconds: 20
        failureThreshold: 3
      volumeMounts:
        - { name: models, mountPath: /models, readOnly: true }
        - { name: wsl-libs, mountPath: /usr/lib/wsl, readOnly: true }
        - { name: dxg, mountPath: /dev/dxg }
  volumes:
    - name: models                       # persistent multi-model store on /var (subdir per model)
      hostPath: { path: /var/cpi-models, type: DirectoryOrCreate }
    - name: wsl-libs
      hostPath: { path: /usr/lib/wsl, type: Directory }
    - name: dxg
      hostPath: { path: /dev/dxg, type: CharDevice }
