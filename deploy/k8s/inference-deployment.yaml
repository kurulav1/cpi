# CPI inference plane — the SERVING half of the CPT(train) + CPI(serve) platform.
#
# Shape: a long-running Deployment (not a Job). N stateless replicas of the CPI
# image (Node web server on :3001 that shells out to the llama_infer CUDA binary),
# load-balanced by a Service, fronted by an Ingress, autoscaled by an HPA. Each
# replica mounts the shared model store read-only at /models — this is the "seam"
# the training plane writes to (CPT checkpoint -> export -> .ll2c -> /models).
#
# Replicas never talk to each other and never talk to the training Job; they only
# read the model artifact. That decoupling is the whole point.
#
# Prereqs on a real cluster:
#   - A GPU node pool with the NVIDIA device plugin (nvidia.com/gpu schedulable).
#   - A ReadWriteMany StorageClass for the models PVC (so every replica can read it),
#     OR swap the PVC for an initContainer that pulls from S3/MinIO into an emptyDir.
#   - metrics-server (for the CPU-based HPA) or a custom-metrics adapter (preferred:
#     scale on queue depth / tokens-in-flight, not CPU).
apiVersion: v1
kind: Namespace
metadata:
  name: cpi-serving
---
# Shared model store. CPT's export step writes versioned artifacts here; CPI reads.
# ReadWriteMany so every serving replica can mount it simultaneously.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: cpi-serving
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  # storageClassName: <your-RWX-class>   # e.g. nfs / cephfs / efs-sc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpi-inference
  namespace: cpi-serving
  labels:
    app: cpi-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpi-inference
  strategy:
    type: RollingUpdate          # zero-downtime model/version rollouts
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cpi-inference
    spec:
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
      containers:
        - name: web
          image: cpi-llama:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: LLAMA_INFER_BIN
              value: /app/bin/llama_infer
            - name: LLAMA_MODEL_DIRS
              value: /models
            - name: LLAMA_MODEL_PATH
              value: /models/Qwen2.5-Coder-3B-Instruct.ll2c
            - name: LLAMA_TOKENIZER_PATH
              value: /models/tokenizer.json
            - name: LLAMA_CHAT_TEMPLATE
              value: qwen2
            # Morph sends a fixed ~5k-token system prompt + short user message.
            # The server default is 2048 (config.mjs), which truncates the prompt
            # and drops the DSL format rules -> prose / empty_surface. Match
            # web/config.json's maxContext.
            - name: LLAMA_MAX_CONTEXT
              value: "8192"
            # Batched prefill pass size. Built-in default (16) caps cold prefill
            # at ~250 tok/s on Blackwell; 256 is ~5.3x faster, byte-identical.
            - name: LLAMA_INFER_PREFILL_CHUNK_SIZE
              value: "256"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            limits:
              nvidia.com/gpu: 1     # one GPU per replica; remove for CPU serving
            requests:
              cpu: "2"
              memory: 4Gi
          # Liveness: the Node process is up. /api/health returns 200 whenever the
          # server is listening (the model-loaded state is in the body, not the code).
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # Readiness: same endpoint for a first cut (gates traffic on "server up").
          # For MODEL-AWARE readiness (don't route until weights are loaded), replace
          # with an exec probe that checks the body, e.g.:
          #   exec: { command: ["sh","-c","curl -sf localhost:3001/api/health | grep -q '\"ready\":true'"] }
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cpi-inference
  namespace: cpi-serving
spec:
  selector:
    app: cpi-inference
  ports:
    - name: http
      port: 80
      targetPort: 3001
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cpi-inference
  namespace: cpi-serving
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"   # streaming completions
spec:
  rules:
    - host: cpi.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cpi-inference
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpi-inference
  namespace: cpi-serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpi-inference
  minReplicas: 2
  maxReplicas: 8
  metrics:
    # CPU is a poor proxy for LLM load but works out of the box with metrics-server.
    # Prefer a custom metric (queue depth / tokens-in-flight) via a metrics adapter.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
