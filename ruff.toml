# Ruff configuration for CPI's Python tooling (tools/).
# Kept intentionally lean: catch real bugs (undefined names, unused imports,
# bad f-strings) without imposing noisy style churn on utility scripts.
target-version = "py310"
line-length = 120

[lint]
# E4/E7/E9 (pycodestyle errors) + F (pyflakes) are ruff's default; add a few
# high-signal bug-catchers. Style-only rules stay off so CI flags defects, not
# formatting opinions.
select = ["E4", "E7", "E9", "F", "B", "UP032", "PLE"]
ignore = [
  "E721",  # type-comparison; benchmark scripts compare dtypes intentionally
  "B008",  # function call in default arg; used deliberately in a few CLIs
  "B905",  # zip() without strict=; not a defect in these scripts
  "B007",  # unused loop var; cosmetic
]

[lint.per-file-ignores]
"tools/**" = ["E402"]  # some scripts set env/sys.path before imports by design
